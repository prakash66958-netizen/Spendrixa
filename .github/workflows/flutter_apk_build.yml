name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: stitch_android_expense_tracker/flutter_app

      - name: Build APK
        run: flutter build apk --release
        working-directory: stitch_android_expense_tracker/flutter_app

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: stitch_android_expense_tracker/flutter_app/build/app/outputs/flutter-apk/app-release.apk
